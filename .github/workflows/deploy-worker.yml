name: Deploy AOK worker
on:
  push:
    branches: [main]
    paths: ["worker/**"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 7b382a7a765cf7a6a9916d58182d1f4d
          workingDirectory: worker
      - name: Check
        run: curl -s https://aok-checker.ozodbekadilov092.workers.dev/
