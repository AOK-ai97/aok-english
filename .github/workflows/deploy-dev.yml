name: Deploy SINOV worker (dev)
on:
  push:
    branches: [dev]
    paths: ["worker/**", ".github/workflows/deploy-dev.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render token (dev)
        env: { CF: "${{ secrets.CLOUDFLARE_API_TOKEN }}" }
        run: |
          RT=$(printf '%s' "$CF:aok-render-dev-v1" | sha256sum | cut -c1-40)
          echo "::add-mask::$RT"
          echo "RENDER_TOKEN=$RT" >> "$GITHUB_ENV"
      - name: Deploy to Cloudflare (aok-checker-dev)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 7b382a7a765cf7a6a9916d58182d1f4d
          workingDirectory: worker
          command: deploy --config wrangler.dev.toml
      # DIQQAT: wrangler-action'ning "secrets:" bandi --config ni e'tiborsiz qoldirib,
      # ASOSIY aok-checker ga yozib yuboradi. Shuning uchun secret alohida, --config bilan qo'yiladi.
      - name: RENDER_TOKEN -> faqat aok-checker-dev
        working-directory: worker
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "7b382a7a765cf7a6a9916d58182d1f4d" }
        run: printf '%s' "$RENDER_TOKEN" | npx --yes wrangler@4 secret put RENDER_TOKEN --config wrangler.dev.toml
      - name: Check
        run: curl -s https://aok-checker-dev.ozodbekadilov092.workers.dev/ | head -c 300
